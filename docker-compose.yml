version: "3.9"

services:
  # ── PostgreSQL Database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cto_os_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cto
      POSTGRES_PASSWORD: cto_password
      POSTGRES_DB: cto_learning_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cto -d cto_learning_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional, visual DB explorer) ─────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cto_os_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: mahesh@cto.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles: ["tools"] # only starts with: docker compose --profile tools up

  # ── Next.js Application (production mode) ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cto_os_app
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://cto:cto_password@db:5432/cto_learning_os
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["production"] # dev uses npm run dev instead

volumes:
  postgres_data:
    name: cto_os_postgres_data
